<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hogwarts Daily Planner</title>
  <meta name="description" content="A Harry Potter themed daily routine planner with Howlers, professors, spells and dungeon creatures.">
  <meta name="theme-color" content="#0b0a1a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <div id="candles" aria-hidden="true"></div>

  <header id="topbar"></header>
  <main id="view"></main>

  <nav id="tabs" aria-label="Sections">
    <button data-action="tab" data-tab="today" class="on"><span>📜</span>Timetable</button>
    <button data-action="tab" data-tab="dungeon"><span>🕯️</span>Dungeon<i class="badge" hidden>0</i></button>
    <button data-action="tab" data-tab="owl"><span>🦉</span>O.W.L.s</button>
    <button data-action="tab" data-tab="spells"><span>✨</span>Spells</button>
    <button data-action="tab" data-tab="settings"><span>🛋️</span>Common Room</button>
  </nav>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/howler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
